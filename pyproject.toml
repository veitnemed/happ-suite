[project]
name = "happ-suite"
version = "2.0.0"
description = "Unified bypass manager for YouTube, Discord, ChatGPT & Gemini"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.scripts]
happ-suite = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
