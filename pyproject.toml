[project]
name = "relay-studio"
version = "2.3.0"
description = "Windows controls for Mihomo VPN, Gemini Web DNS and Antigravity"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
relay-studio = "src.start:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
