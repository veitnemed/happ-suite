[project]
name = "happ-suite"
version = "2.1.0rc1"
description = "Windows tray controls for HAPP VPN and AG Unlocker"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.scripts]
happ-suite = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
