name: Windows validation and Setup build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[test]" pyinstaller
      - name: Run unit tests (no live TUN)
        run: python -m pytest -q
      - name: Build Relay Studio application directory
        run: python scripts/build.py --entry start --dist-dir "${{ runner.temp }}/dist" --work-dir "${{ runner.temp }}/build"
      - name: Smoke test packaged CLI
        shell: pwsh
        run: '& "${{ runner.temp }}/dist/RelayStudio/RelayStudio.exe" --self-check'
      - name: Smoke test packaged Qt interface
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Start-Process -FilePath "${{ runner.temp }}/dist/RelayStudio/RelayStudio.exe" -ArgumentList '--ui-preview', '--preview-quit-after', '1500' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { throw 'Qt preview did not exit' }
          if ($app.ExitCode -ne 0) { throw 'Qt preview failed' }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and inspect Windows Setup
        run: python scripts/build_setup.py --source "${{ runner.temp }}/dist/RelayStudio" --output "${{ runner.temp }}/release"
      - name: Upload Windows Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayStudio-Setup
          path: ${{ runner.temp }}/release/RelayStudio-Setup-*-win-x64.exe
          if-no-files-found: error
