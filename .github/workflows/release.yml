name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and build dependencies
        run: python -m pip install -e ".[test]" pyinstaller
      - name: Run test suite
        run: python -m pytest -q
      - name: Build package-aware Relay Studio
        run: python scripts/build.py --entry start --dist-dir "${{ runner.temp }}/dist" --work-dir "${{ runner.temp }}/build"
      - name: Verify packaged application contents
        shell: pwsh
        run: '& "${{ runner.temp }}/dist/RelayStudio/RelayStudio.exe" --self-check'
      - name: Package release ZIP
        run: python scripts/package_release.py --source "${{ runner.temp }}/dist/RelayStudio" --output "${{ runner.temp }}/release"
      - name: Build Windows Setup
        run: python scripts/build_setup.py --source "${{ runner.temp }}/dist/RelayStudio" --output "${{ runner.temp }}/release"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = python -c "from scripts.build_setup import app_version; print(app_version())"
          if ($tag -ne "v$version") { throw "Tag $tag does not match package version $version" }
          $output = Join-Path $env:RUNNER_TEMP "release"
          $setup = Join-Path $output "RelayStudio-Setup-$version-win-x64.exe"
          $archive = Join-Path $output "RelayStudio-$version-win-x64.zip"
          $checksum = "$archive.sha256"
          foreach ($asset in @($setup, $archive, $checksum)) {
            if (-not (Test-Path $asset)) { throw "Release asset is missing: $([IO.Path]::GetFileName($asset))" }
          }
          gh release create $tag $setup $archive $checksum --title "Happ Suite $version" --notes "Windows x64 release. Includes the installer and portable ZIP. The package omits local configuration, subscription credentials, and user runtime data." --latest
